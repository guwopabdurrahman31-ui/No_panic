plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('PANIC_PASS_KEYSTORE')
def releaseStorePassword = System.getenv('PANIC_PASS_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('PANIC_PASS_KEY_ALIAS') ?: 'upload'
def hasReleaseSigning = releaseKeystore && releaseStorePassword

android {
    namespace 'com.guwopabdurrahman31ui.panicpasssos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.guwopabdurrahman31ui.panicpasssos'
        minSdk 23
        targetSdk 36
        versionCode 14
        versionName '1.0.10'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseStorePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
    }

    packaging {
        resources {
            excludes += ['**/._*']
        }
    }

    sourceSets {
        main {
            assets.srcDir layout.buildDirectory.dir('generated/webAssets')
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}

// 웹 PWA의 최신 화면과 음악을 앱 안에 포함한다. 네트워크나 TWA 없이 완전히 오프라인으로 실행된다.
tasks.register('syncWebAssets', Sync) {
    into layout.buildDirectory.dir('generated/webAssets/www')
    from(rootProject.projectDir) {
        include 'index.html'
        include 'privacy_policy.html'
        include 'creator.html'
        include 'COPYRIGHT.txt'
        include 'manifest.json'
    }
    from(rootProject.file('assets')) {
        into 'assets'
        exclude '**/._*'
    }
}

preBuild.dependsOn tasks.named('syncWebAssets')
